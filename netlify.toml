# Netlify 部署配置 · 68海里·两面
# 本项目为纯静态站点（HTML / CSS / JS / 图片），无需构建步骤。

[build]
  publish = "."
  command = ""

# 默认 charset 与缓存策略
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 入口默认指向 index.html，已存在不需要 redirect

# 中文文件名兼容（Netlify 默认支持 UTF-8 路径）
